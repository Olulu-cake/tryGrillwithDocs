name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
      JWT_SECRET: "super-secret-ci-key"
      SESSION_SECRET: "ecommerce_dev_secret_key_2026"
      CORS_ORIGIN: "http://localhost:3000"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-key-for-testing' }}
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_URL: http://localhost:8080
      BASE_URL: http://localhost:3000
      PORT: 8080
      FRONTEND_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v4.2.2

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Create .env Files for CI Parity
      run: |
        echo "DATABASE_URL=${{ env.DATABASE_URL }}" > $GITHUB_WORKSPACE/.env
        echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> $GITHUB_WORKSPACE/.env
        echo "SESSION_SECRET=${{ env.SESSION_SECRET }}" >> $GITHUB_WORKSPACE/.env
        echo "CORS_ORIGIN=${{ env.CORS_ORIGIN }}" >> $GITHUB_WORKSPACE/.env
        echo "NODE_OPTIONS=${{ env.NODE_OPTIONS }}" >> $GITHUB_WORKSPACE/.env
        echo "PORT=${{ env.PORT }}" >> $GITHUB_WORKSPACE/.env
        echo "FRONTEND_URL=${{ env.FRONTEND_URL }}" >> $GITHUB_WORKSPACE/.env
        echo "NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}" >> $GITHUB_WORKSPACE/.env
        
        # Sync environment files
        cp $GITHUB_WORKSPACE/.env $GITHUB_WORKSPACE/.env.local
        cp $GITHUB_WORKSPACE/.env $GITHUB_WORKSPACE/storefront/.env
        cp $GITHUB_WORKSPACE/.env $GITHUB_WORKSPACE/storefront/.env.local
        cp $GITHUB_WORKSPACE/.env $GITHUB_WORKSPACE/storefront/.env.production
        
        # Ensure specific Next.js public variables exist in storefront/.env.local
        echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_WORKSPACE/storefront/.env.local
        echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> $GITHUB_WORKSPACE/storefront/.env.local

    - name: Install Dependencies
      run: npm ci

    - name: Install Storefront Dependencies
      run: npm ci
      working-directory: ./storefront

    - name: Generate & Push DB Schema & Seed
      run: |
        npx prisma generate --schema=prisma/schema.prisma
        npx prisma db push --force-reset --schema=prisma/schema.prisma
        npx ts-node prisma/seed.ts
      working-directory: ./

    - name: Build Next.js Storefront
      run: npm run build
      working-directory: ./storefront
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"

    - name: Install Playwright Browsers & Deps
      run: npx playwright install --with-deps
      working-directory: ./storefront

    - name: Start Backend API & Run Playwright Tests
      run: |
        nohup npx ts-node $GITHUB_WORKSPACE/src/app.ts > $GITHUB_WORKSPACE/api.log 2>&1 &
        npx wait-on tcp:8080 --timeout 15000 || (echo "=== API STARTUP FAILED ===" && cat $GITHUB_WORKSPACE/api.log && exit 1)
        npx playwright test --workers=1
      working-directory: ./storefront
      env:
        PORT: 8080
        CI: true
        NEXT_PUBLIC_API_URL: "http://localhost:8080"

    - name: Print Backend API Log
      if: always()
      run: |
        if [ -f $GITHUB_WORKSPACE/api.log ]; then
          cat $GITHUB_WORKSPACE/api.log
        fi

    - name: Upload Playwright Report on Failure
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: playwright-report
        path: storefront/playwright-report/
        retention-days: 7

    - name: Upload Backend Logs on Failure
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: backend-logs
        path: api.log
        retention-days: 7
