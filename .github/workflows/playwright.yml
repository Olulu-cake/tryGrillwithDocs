name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: storefront/package-lock.json

    - name: Install Root Dependencies
      run: npm ci

    - name: Install Storefront Dependencies
      run: npm ci --include=dev
      working-directory: ./storefront

    - name: Install Dependencies for CI
      run: npm install wait-on --save-dev

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('storefront/package-lock.json') }}

    - name: Install Playwright Browsers & Deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
      working-directory: ./storefront

    - name: Install Playwright System Deps only
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
      working-directory: ./storefront

    - name: Build Next.js Storefront
      run: npx next build || npm run build
      working-directory: ./storefront

    - name: Start Backend API Server
      run: |
        npx ts-node src/app.ts &
        npx wait-on http://localhost:8080
      working-directory: ./
      env:
        DATABASE_URL: "file:./dev.db"
        PORT: 8080

    - name: Run Playwright tests
      run: npx playwright test
      working-directory: ./storefront
      env:
        CI: true
        BASE_URL: http://localhost:8080

    - name: Upload Playwright Report on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: storefront/playwright-report/
        retention-days: 7
