name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: storefront/package-lock.json

    - name: Install Root Dependencies
      run: npm ci

    - name: Install Storefront Dependencies
      run: npm ci --include=dev
      working-directory: ./storefront

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: ./storefront

    - name: Build Next.js Storefront
      run: npx next build || npm run build
      working-directory: ./storefront

    - name: Run Playwright tests
      run: npx playwright test
      working-directory: ./storefront
      env:
        CI: true

    - name: Upload Playwright Report on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: storefront/playwright-report/
        retention-days: 7
