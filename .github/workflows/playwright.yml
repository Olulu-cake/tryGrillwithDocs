name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-key-for-testing' }}
    steps:
    - uses: actions/checkout@v4.2.2

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Storefront Dependencies
      run: npm ci
      working-directory: ./storefront

    - name: Generate Prisma Client & Push DB
      run: |
        npx prisma generate
        npx prisma db push --accept-data-loss
      working-directory: ./

    - name: Seed Database
      run: npx ts-node prisma/seed.ts
      working-directory: ./

    - name: Build Next.js Storefront
      run: npm run build
      working-directory: ./storefront
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-key-for-testing' }}
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8080

    - name: Install Playwright Browsers & Deps
      run: npx playwright install --with-deps
      working-directory: ./storefront

    - name: Start Services (API & Storefront)
      run: |
        npx ts-node src/app.ts &
        npm run start -- --port 3000 &
        sleep 5
      working-directory: ./
      env:
        PORT: 8080
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-key-for-testing' }}


    - name: Run Playwright tests
      run: npx playwright test --workers=1
      working-directory: ./storefront
      env:
        CI: true
        BASE_URL: http://127.0.0.1:3000
        API_URL: http://127.0.0.1:8080
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-key-for-testing' }}
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8080

    - name: Upload Playwright Report on Failure
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: playwright-report
        path: storefront/playwright-report/
        retention-days: 7