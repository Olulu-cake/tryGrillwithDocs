name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
      JWT_SECRET: "super-secret-ci-key"
      SESSION_SECRET: "super-secret-session-key"
      CORS_ORIGIN: "http://localhost:3000"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-key-for-testing' }}
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_URL: http://localhost:8080
      BASE_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v4.2.2

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Create .env Files for CI Parity
      run: |
        echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env
        echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> .env
        echo "SESSION_SECRET=${{ env.SESSION_SECRET }}" >> .env
        echo "CORS_ORIGIN=${{ env.CORS_ORIGIN }}" >> .env
        echo "NODE_OPTIONS=${{ env.NODE_OPTIONS }}" >> .env
        echo "PORT=8080" >> .env
        echo "NEXT_PUBLIC_API_URL=http://localhost:8080" >> .env
        
        # Sync environment files
        cp .env .env.local
        cp .env storefront/.env
        cp .env storefront/.env.local
        cp .env storefront/.env.production
        
        # Ensure specific Next.js public variables exist in storefront/.env.local
        echo "NEXTAUTH_URL=http://localhost:3000" >> storefront/.env.local
        echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> storefront/.env.local

    - name: Install Dependencies
      run: npm ci

    - name: Install Storefront Dependencies
      run: npm ci
      working-directory: ./storefront

    - name: Generate Prisma Client & Push DB
      run: |
        npx prisma generate
        npx prisma db push --accept-data-loss
      working-directory: ./

    - name: Seed Database
      run: npx ts-node prisma/seed.ts
      working-directory: ./

    - name: Build Next.js Storefront
      run: npm run build
      working-directory: ./storefront

    - name: Install Playwright Browsers & Deps
      run: npx playwright install --with-deps
      working-directory: ./storefront

    - name: Start Backend API & Run Playwright Tests
      run: |
        nohup npx ts-node src/app.ts > api.log 2>&1 &
        npx wait-on tcp:8080
        cd storefront
        npx playwright test --workers=1
      env:
        PORT: 8080
        CI: true

    - name: Print Backend API Log
      if: always()
      run: cat api.log

    - name: Upload Playwright Report on Failure
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: playwright-report
        path: storefront/playwright-report/
        retention-days: 7

    - name: Upload Backend Logs on Failure
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: backend-logs
        path: api.log
        retention-days: 7
